<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HomeBot — Home Services</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 720px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .chat-header {
      background: #1a73e8;
      color: white;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .header-info h2 { font-size: 16px; font-weight: 600; }
    .header-info p { font-size: 12px; opacity: 0.85; margin-top: 2px; }

    .online-dot {
      width: 8px; height: 8px;
      background: #4cfe8a;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }

    .message.bot { align-self: flex-start; }
    .message.user { align-self: flex-end; }

    .bubble {
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .bot .bubble {
      background: #f0f2f5;
      color: #111;
      border-bottom-left-radius: 4px;
    }

    .user .bubble {
      background: #1a73e8;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .timestamp {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
      padding: 0 4px;
    }

    .message.user .timestamp { text-align: right; }

    .typing-indicator .bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 18px;
    }

    .dot {
      width: 7px; height: 7px;
      background: #999;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    .done-banner {
      background: #e8f5e9;
      color: #2e7d32;
      text-align: center;
      padding: 12px;
      font-size: 13px;
      font-weight: 500;
      border-top: 1px solid #c8e6c9;
    }

    .input-area {
      padding: 14px 16px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      border: 1.5px solid #ddd;
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 120px;
      line-height: 1.4;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: #1a73e8; }

    button {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: #1a73e8;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    button:hover { background: #1558b0; }
    button:disabled { background: #ccc; cursor: not-allowed; }

    .returning-bar {
      padding: 10px 16px;
      border-top: 1px solid #eee;
      text-align: center;
    }

    .returning-bar a {
      font-size: 12px;
      color: #1a73e8;
      cursor: pointer;
      text-decoration: underline;
    }

    .history-panel {
      display: none;
      padding: 12px 16px;
      border-top: 1px solid #eee;
      background: #f9f9f9;
    }

    .history-panel input {
      width: 100%;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
      margin-bottom: 8px;
    }

    .history-panel input:focus { border-color: #1a73e8; }

    .history-panel button.lookup-btn {
      width: 100%;
      border-radius: 8px;
      font-size: 13px;
      height: 34px;
      margin-bottom: 8px;
    }

    .past-entry {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 12px;
      color: #333;
    }

    .past-entry .entry-date { color: #888; margin-bottom: 4px; }
    .past-entry .entry-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .badge-emergency { background: #fde8e8; color: #c0392b; }
    .badge-routine { background: #e8f5e9; color: #27ae60; }

    .past-transcript { margin-top: 8px; border-top: 1px solid #eee; padding-top: 8px; }
    .past-transcript .t-row { margin-bottom: 6px; }
    .past-transcript .t-label { font-weight: 600; }
    .past-transcript .t-customer { color: #1a73e8; }
    .past-transcript .t-bot { color: #555; }

    /* Welcome overlay */
    .welcome-overlay {
      position: absolute;
      inset: 0;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      z-index: 10;
    }

    .welcome-overlay .house-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .welcome-overlay h2 {
      font-size: 20px;
      font-weight: 700;
      color: #111;
      margin-bottom: 8px;
      text-align: center;
    }

    .welcome-overlay p {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-bottom: 28px;
    }

    .welcome-btns {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 300px;
    }

    .welcome-btns .btn-primary {
      width: 100%;
      height: 46px;
      border-radius: 12px;
      border: none;
      background: #1a73e8;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .welcome-btns .btn-primary:hover { background: #1558b0; }

    .welcome-btns .btn-secondary {
      width: 100%;
      height: 46px;
      border-radius: 12px;
      border: 1.5px solid #1a73e8;
      background: white;
      color: #1a73e8;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .welcome-btns .btn-secondary:hover { background: #f0f5ff; }

    /* Returning customer lookup inside overlay */
    .returning-lookup {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 300px;
    }

    .returning-lookup input[type="email"] {
      width: 100%;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 14px;
      outline: none;
      margin-bottom: 10px;
      box-sizing: border-box;
    }

    .returning-lookup input[type="email"]:focus { border-color: #1a73e8; }

    .returning-lookup .btn-primary {
      width: 100%;
      height: 44px;
      border-radius: 10px;
      border: none;
      background: #1a73e8;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .returning-lookup .back-link {
      font-size: 12px;
      color: #888;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 4px;
    }

    .returning-lookup .status-msg {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-top: 8px;
    }

    /* Welcome-back card */
    .welcome-back-card {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 320px;
    }

    .welcome-back-card .wb-title {
      font-size: 18px;
      font-weight: 700;
      color: #111;
      margin-bottom: 6px;
      text-align: center;
    }

    .welcome-back-card .wb-sub {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-bottom: 6px;
    }

    .welcome-back-card .wb-last {
      background: #f0f2f5;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      color: #333;
      width: 100%;
      margin-bottom: 18px;
    }

    .welcome-back-card .wb-last strong { color: #1a73e8; }

    .welcome-back-card .btn-primary,
    .welcome-back-card .btn-secondary {
      width: 100%;
      height: 44px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .welcome-back-card .btn-primary {
      border: none;
      background: #1a73e8;
      color: white;
    }
    .welcome-back-card .btn-primary:hover { background: #1558b0; }

    .welcome-back-card .btn-secondary {
      border: 1.5px solid #1a73e8;
      background: white;
      color: #1a73e8;
    }
    .welcome-back-card .btn-secondary:hover { background: #f0f5ff; }
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <div class="chat-header">
      <div class="avatar">🏠</div>
      <div class="header-info">
        <h2>HomeBot</h2>
        <p><span class="online-dot"></span>Home Services · Available 24/7</p>
      </div>
    </div>

    <!-- Welcome overlay shown on page load -->
    <div class="welcome-overlay" id="welcome-overlay">
      <div class="house-icon">🏠</div>
      <h2>Welcome to HomeBot</h2>
      <p>Your 24/7 home services assistant.<br>Are you a new or returning customer?</p>

      <div class="welcome-btns" id="welcome-btns">
        <button class="btn-primary" onclick="startNew()">New Customer</button>
        <button class="btn-secondary" onclick="showReturningLookup()">Returning Customer</button>
      </div>

      <div class="returning-lookup" id="returning-lookup">
        <input type="email" id="returning-email" placeholder="Enter your email address" />
        <button class="btn-primary" onclick="checkReturning()">Continue</button>
        <span class="back-link" onclick="showWelcomeBtns()">← Back</span>
        <div class="status-msg" id="returning-status"></div>
      </div>

      <div class="welcome-back-card" id="welcome-back-card">
        <div class="wb-title" id="wb-title">Welcome back!</div>
        <div class="wb-sub">We found your previous request.</div>
        <div class="wb-last" id="wb-last"></div>
        <button class="btn-primary" onclick="resumeConversation()">Continue last conversation</button>
        <button class="btn-secondary" onclick="startNew()">Start a new request</button>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div id="done-banner" class="done-banner" style="display:none;">
      ✅ All done! Check your email for a confirmation. We'll be in touch soon.
    </div>

    <div class="input-area">
      <textarea id="input" placeholder="Describe your issue..." rows="1"></textarea>
      <button id="send-btn" onclick="sendMessage()">&#10148;</button>
    </div>

    <div class="returning-bar">
      <a onclick="toggleHistory()">View your past conversations</a>
    </div>

    <div class="history-panel" id="history-panel">
      <input type="email" id="history-email" placeholder="Enter your email address" />
      <button class="lookup-btn" onclick="lookupHistory()">Look up my conversations</button>
      <div id="history-results"></div>
    </div>
  </div>

  <script>
    let sessionId = null;
    let conversationDone = false;
    let returningEmail = null;
    let returningTranscript = null;
    let returningCustomerName = null;

    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send-btn");

    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = inputEl.scrollHeight + "px";
    });

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function getTime() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function appendMessage(text, sender) {
      const wrap = document.createElement("div");
      wrap.className = `message ${sender}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      const ts = document.createElement("div");
      ts.className = "timestamp";
      ts.textContent = getTime();

      wrap.appendChild(bubble);
      wrap.appendChild(ts);
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return wrap;
    }

    function showTyping() {
      const wrap = document.createElement("div");
      wrap.className = "message bot typing-indicator";
      wrap.id = "typing";
      wrap.innerHTML = `<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById("typing");
      if (el) el.remove();
    }

    // --- Welcome overlay ---

    function startNew() {
      document.getElementById("welcome-overlay").style.display = "none";
      appendMessage("Hi! I'm HomeBot, your home services assistant. How can I help you today?", "bot");
      inputEl.focus();
    }

    function showReturningLookup() {
      document.getElementById("welcome-btns").style.display = "none";
      document.getElementById("returning-lookup").style.display = "flex";
      document.getElementById("returning-email").focus();
    }

    function showWelcomeBtns() {
      document.getElementById("returning-lookup").style.display = "none";
      document.getElementById("welcome-back-card").style.display = "none";
      document.getElementById("welcome-btns").style.display = "flex";
      document.getElementById("returning-status").textContent = "";
    }

    async function checkReturning() {
      const email = document.getElementById("returning-email").value.trim();
      const statusEl = document.getElementById("returning-status");
      if (!email) { statusEl.textContent = "Please enter your email."; return; }

      statusEl.textContent = "Looking up your account...";
      returningEmail = email;

      const res = await fetch("/returning", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();

      if (!data.found) {
        statusEl.textContent = "No account found. Starting a new conversation.";
        setTimeout(() => startNew(), 1200);
        return;
      }

      // Store for use in resumeConversation
      returningTranscript = data.transcript || [];
      returningCustomerName = data.customer_name || null;

      // Show welcome-back card
      document.getElementById("returning-lookup").style.display = "none";
      statusEl.textContent = "";

      const date = new Date(data.last_timestamp).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
      const nameDisplay = data.customer_name ? ` ${data.customer_name.split(" ")[0]}` : "";
      document.getElementById("wb-title").textContent = `Welcome back${nameDisplay}!`;
      document.getElementById("wb-last").innerHTML =
        `<strong>Last visit:</strong> ${date}<br>` +
        (data.last_service ? `<strong>Service:</strong> ${data.last_service}<br>` : "") +
        (data.last_problem ? `<strong>Issue:</strong> ${data.last_problem}` : "");

      document.getElementById("welcome-back-card").style.display = "flex";
    }

    async function resumeConversation() {
      const res = await fetch("/resume", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: returningEmail }),
      });

      if (!res.ok) { startNew(); return; }
      const data = await res.json();
      sessionId = data.session_id;

      document.getElementById("welcome-overlay").style.display = "none";

      // Show previous transcript as read-only history (collapsed by default)
      if (returningTranscript && returningTranscript.length > 0) {
        const historyWrap = document.createElement("div");
        historyWrap.style.cssText = "margin: 8px 0;";
        historyWrap.innerHTML = `<details style="font-size:11px;color:#aaa;text-align:center;cursor:pointer;">
          <summary style="list-style:none;padding:4px 0;">— View previous conversation —</summary>
          <div id="prev-transcript" style="margin-top:8px;"></div>
        </details>`;
        messagesEl.appendChild(historyWrap);

        const prevEl = historyWrap.querySelector("#prev-transcript");
        for (const msg of returningTranscript) {
          const wrap = document.createElement("div");
          wrap.className = `message ${msg.role === "user" ? "user" : "bot"}`;
          wrap.style.opacity = "0.6";
          wrap.innerHTML = `<div class="bubble">${msg.content}</div>`;
          prevEl.appendChild(wrap);
        }
      }

      // Fresh greeting — this is a new request, not a continuation
      const name = returningCustomerName ? `, ${returningCustomerName.split(" ")[0]}` : "";
      appendMessage(`Welcome back${name}! Your contact info is already on file. What can I help you with today?`, "bot");
      inputEl.focus();
    }

    // --- Chat ---

    async function sendMessage() {
      if (conversationDone) return;
      const text = inputEl.value.trim();
      if (!text) return;

      appendMessage(text, "user");
      inputEl.value = "";
      inputEl.style.height = "auto";
      sendBtn.disabled = true;
      showTyping();

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });

        const data = await res.json();
        removeTyping();
        sessionId = data.session_id;

        appendMessage(data.reply, "bot");

        if (data.done) {
          conversationDone = true;
          document.getElementById("done-banner").style.display = "block";
          inputEl.disabled = true;
          sendBtn.disabled = true;
        } else {
          sendBtn.disabled = false;
          inputEl.focus();
        }
      } catch (err) {
        removeTyping();
        appendMessage("Something went wrong. Please try again.", "bot");
        sendBtn.disabled = false;
      }
    }

    function toggleHistory() {
      const panel = document.getElementById("history-panel");
      panel.style.display = panel.style.display === "block" ? "none" : "block";
    }

    async function lookupHistory() {
      const email = document.getElementById("history-email").value.trim();
      const resultsEl = document.getElementById("history-results");
      if (!email) { resultsEl.innerHTML = "<p style='color:red;font-size:12px'>Please enter your email.</p>"; return; }

      resultsEl.innerHTML = "<p style='font-size:12px;color:#888'>Looking up...</p>";

      const res = await fetch("/history", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();

      if (!data.conversations || data.conversations.length === 0) {
        resultsEl.innerHTML = "<p style='font-size:12px;color:#888'>No past conversations found for this email.</p>";
        return;
      }

      resultsEl.innerHTML = data.conversations.map((c) => {
        const date = new Date(c.timestamp).toLocaleString();
        const badge = c.urgency === "EMERGENCY"
          ? `<span class="entry-badge badge-emergency">EMERGENCY</span>`
          : `<span class="entry-badge badge-routine">ROUTINE</span>`;

        const transcript = (c.transcript || []).map(m => {
          const isUser = m.role === "user";
          return `<div class="t-row">
            <span class="t-label ${isUser ? "t-customer" : "t-bot"}">${isUser ? "You" : "HomeBot"}:</span>
            ${m.content}
          </div>`;
        }).join("");

        return `<div class="past-entry">
          <div class="entry-date">${date}</div>
          ${badge}
          <div><strong>Service:</strong> ${c.service || "—"}</div>
          <div><strong>Problem:</strong> ${c.problem || "—"}</div>
          ${c.preferred_time ? `<div><strong>Appointment:</strong> ${c.preferred_time} ${c.timezone || ""}</div>` : ""}
          <details>
            <summary style="font-size:11px;cursor:pointer;color:#1a73e8;margin-top:6px">View full conversation</summary>
            <div class="past-transcript">${transcript}</div>
          </details>
        </div>`;
      }).join("");
    }
  </script>
</body>
</html>

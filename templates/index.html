<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HomeBot — Home Services</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 720px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #1a73e8;
      color: white;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .header-info h2 { font-size: 16px; font-weight: 600; }
    .header-info p { font-size: 12px; opacity: 0.85; margin-top: 2px; }

    .online-dot {
      width: 8px; height: 8px;
      background: #4cfe8a;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }

    .message.bot { align-self: flex-start; }
    .message.user { align-self: flex-end; }

    .bubble {
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .bot .bubble {
      background: #f0f2f5;
      color: #111;
      border-bottom-left-radius: 4px;
    }

    .user .bubble {
      background: #1a73e8;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .timestamp {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
      padding: 0 4px;
    }

    .message.user .timestamp { text-align: right; }

    .typing-indicator .bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 18px;
    }

    .dot {
      width: 7px; height: 7px;
      background: #999;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    .done-banner {
      background: #e8f5e9;
      color: #2e7d32;
      text-align: center;
      padding: 12px;
      font-size: 13px;
      font-weight: 500;
      border-top: 1px solid #c8e6c9;
    }

    .input-area {
      padding: 14px 16px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      border: 1.5px solid #ddd;
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 120px;
      line-height: 1.4;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: #1a73e8; }

    button {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: #1a73e8;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    button:hover { background: #1558b0; }
    button:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <div class="chat-header">
      <div class="avatar">🏠</div>
      <div class="header-info">
        <h2>HomeBot</h2>
        <p><span class="online-dot"></span>Home Services · Available 24/7</p>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="message bot">
        <div class="bubble">Hi! I'm HomeBot, your home services assistant. How can I help you today?</div>
        <div class="timestamp">Just now</div>
      </div>
    </div>

    <div id="done-banner" class="done-banner" style="display:none;">
      ✅ All done! Check your email for a confirmation. We'll be in touch soon.
    </div>

    <div class="input-area">
      <textarea id="input" placeholder="Describe your issue..." rows="1"></textarea>
      <button id="send-btn" onclick="sendMessage()">&#10148;</button>
    </div>
  </div>

  <script>
    let sessionId = null;
    let conversationDone = false;

    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send-btn");

    // Auto-resize textarea
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = inputEl.scrollHeight + "px";
    });

    // Send on Enter (Shift+Enter for newline)
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function getTime() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function appendMessage(text, sender) {
      const wrap = document.createElement("div");
      wrap.className = `message ${sender}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      const ts = document.createElement("div");
      ts.className = "timestamp";
      ts.textContent = getTime();

      wrap.appendChild(bubble);
      wrap.appendChild(ts);
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return wrap;
    }

    function showTyping() {
      const wrap = document.createElement("div");
      wrap.className = "message bot typing-indicator";
      wrap.id = "typing";
      wrap.innerHTML = `<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById("typing");
      if (el) el.remove();
    }

    async function sendMessage() {
      if (conversationDone) return;
      const text = inputEl.value.trim();
      if (!text) return;

      appendMessage(text, "user");
      inputEl.value = "";
      inputEl.style.height = "auto";
      sendBtn.disabled = true;
      showTyping();

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });

        const data = await res.json();
        removeTyping();
        sessionId = data.session_id;

        appendMessage(data.reply, "bot");

        if (data.done) {
          conversationDone = true;
          document.getElementById("done-banner").style.display = "block";
          inputEl.disabled = true;
          sendBtn.disabled = true;
        } else {
          sendBtn.disabled = false;
          inputEl.focus();
        }
      } catch (err) {
        removeTyping();
        appendMessage("Something went wrong. Please try again.", "bot");
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
